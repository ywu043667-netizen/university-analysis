*{box-sizing:border-box}body{margin:0;padding:18px;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:#f3f6f9;color:#1f2937}.container{max-width:1800px;margin:auto;background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.1);padding:20px}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{margin:0;color:#1f4e78;font-size:26px}.section{margin-top:16px;padding:16px;background:#eef3f7;border-radius:8px}.section h2{margin:0 0 12px;color:#1f4e78;font-size:18px}.status{margin-top:14px;padding:11px 14px;border-left:5px solid #1f4e78;background:#e9ecef;border-radius:5px;line-height:1.6}.status.success{border-color:#198754;background:#d1e7dd;color:#0f5132}.status.error{border-color:#b02a37;background:#f8d7da;color:#842029}.file-input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0,0,0,0)}.file-button,button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 16px;border:0;border-radius:5px;background:#1f4e78;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}.file-button:hover,button:hover{filter:brightness(.9)}button.secondary{background:#6c757d}button.warning{background:#c27400}button.success{background:#218838}.score-grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:12px;width:100%}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:14px;font-weight:700}input,select{width:100%;min-width:0;min-height:36px;padding:7px 9px;border:1px solid #b9c2ca;border-radius:5px;background:#fff;font:inherit}input:focus,select:focus{outline:2px solid rgba(31,78,120,.2);border-color:#1f4e78}.year-options,.check-options{display:flex;align-items:center;flex-wrap:wrap;gap:14px;min-height:36px}.year-options label,.check-options label{display:inline-flex;align-items:center;gap:5px;font-w <body>
<div class="container">
<div class="header"><h1>大學科系篩選與落點分析工具</h1><div><input type="file" id="fileInput" class="file-input" accept=".xlsx,.xls"><label for="fileInput" class="file-button">選擇 Excel 資料檔</label></div></div>
<div id="status" class="status">請先選擇包含 111～114 年志願落點分析工作表的 Excel 檔案。</div>
<section class="section"><h2>一、輸入個人成績</h2><div class="score-grid">
<div class="field"><label>國文</label><input id="scoreChinese" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>英文</label><input id="scoreEnglish" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>數A</label><input id="scoreMathA" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>數B</label><input id="scoreMathB" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>社會</label><input id="scoreSociety" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>自然</label><input id="scoreScience" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>數甲</label><input id="scoreMath1" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>數乙</label><input id="scoreMath2" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>物理</label><input id="scorePhysics" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>化學</label><input id="scoreChemistry" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>生物</label><input id="scoreBiology" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>歷史</label><input id="scoreHistory" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>地理</label><input id="scoreGeography" type="text" inputmode="decimal" placeholder="請輸入"></div><div class="field"><label>公民</label><input id="scoreCivics" type="text" inputmode="decimal" placeholder="請輸入"></div>
</div><div class="note">未填科目不會當成 0 分；支援半形及全形數字，例如 45、45.5、４５、４５．５。</div></section>
<section class="section"><h2>二、篩選條件</h2><div class="filter-grid">
<div class="field span-2" style="grid-column:span 2"><label>年度</label><div class="year-options"><label><input class="year-cb" type="checkbox" value="114" checked>114</label><label><input class="year-cb" type="checkbox" value="113" checked>113</label><label><input class="year-cb" type="checkbox" value="112" checked>112</label><label><input class="year-cb" type="checkbox" value="111" checked>111</label></div></div><div class="field"><label>學群</label><select id="groupSelect"><option value="全部">全部</option></select></div><div class="field"><label>學校</label><select id="schoolSelect"><option value="全部">全部</option></select></div><div class="field"><label>校名關鍵字</label><input id="schoolKw" type="text"></div><div class="field"><label>科系關鍵字</label><input id="deptKw" type="text"></div><div class="field"><label>採計科目關鍵字</label><input id="subjKw" type="text"></div><div class="field"><label>最低錄取分數 ≥</label><input id="minScore" type="text" inputmode="decimal"></div><div class="field"><label>最低錄取分數 ≤</label><input id="maxScore" type="text" inputmode="decimal"></div><div class="field"><label>錄取人數 ≥</label><input id="minAdmissions" type="text" inputmode="numeric"></div><div class="field"><label>我的分數差 ≥</label><input id="minDifference" type="text" inputmode="decimal"></div><div class="field"><label>我的分數差 ≤</label><input id="maxDifference" type="text" inputmode="decimal"></div><div class="field span-2" style="grid-column:span 2"><label>其他條件</label><div class="check-options"><label><input id="scoreRequired" type="checkbox">須有最低錄取分數</label><label><input id="completeRequired" type="checkbox">只顯示可完整計算</label><label><input id="passedOnly" type="checkbox">只顯示達標校系</label></div></div></div>
<div class="buttons"><button id="analyzeBtn">開始分析</button><button id="resetBtn" class="secondary">清除篩選條件</button><button id="clearScoresBtn" class="warning">清除個人成績</button><button id="exportBtn" class="success export-button" style="margin-left:auto">匯出結果與統計 Excel</button></div></section>
<div class="tabs"><div class="tab active" data-target="resultTab">篩選結果</div><div class="tab" data-target="groupTab">依學群統計</div><div class="tab" data-target="schoolTab">依學校統計</div><div class="tab" data-target="yearTab">依年度統計</div></div>
<div id="resultTab" class="tab-content active table-wrap"><table id="resultTable"><thead><tr><th data-sort="年度">年度</th><th data-sort="系組代碼">系組代碼</th><th data-sort="校名">校名</th><th data-sort="系組名">系組名</th><th data-sort="學群分類">學群分類</th><th data-sort="採計及加權">採計及加權</th><th data-sort="錄取人數">錄取人數</th><th data-sort="最低錄取分數">最低錄取分數</th><th data-sort="我的加權分數">我的加權分數</th><th data-sort="分數差">分數差</th><th data-sort="落點判斷">落點判斷</th></tr></thead><tbody></tbody></table></div>
<div id="groupTab" class="tab-content table-wrap"><table id="groupTable"><thead></thead><tbody></tbody></table></div><div id="schoolTab" class="tab-content table-wrap"><table id="schoolTable"><thead></thead><tbody></tbody></table></div><div id="yearTab" class="tab-content table-wrap"><table id="yearTable"><thead></thead><tbody></tbody></table></div>
</div>
<script>
"use strict";
const YEARS=["114","113","112","111"],RESULT_COLUMNS=["年度","系組代碼","校名","系組名","學群分類","採計及加權","錄取人數","最低錄取分數","我的加權分數","分數差","落點判斷"],SUMMARY_COLUMNS=["分類","校系筆數","達標筆數","未達標筆數","無法計算筆數","錄取人數合計","平均最低錄取分數","最低錄取分數最低值","最低錄取分數最高值","平均個人加權分數","平均分數差"],SUBJECT_INPUTS={"國文":"scoreChinese","英文":"scoreEnglish","數A":"scoreMathA","數B":"scoreMathB","社會":"scoreSociety","自然":"scoreScience","數甲":"scoreMath1","數乙":"scoreMath2","物理":"scorePhysics","化學":"scoreChemistry","生物":"scoreBiology","歷史":"scoreHistory","地理":"scoreGeography","公民":"scoreCivics"},ALIASES={"國":"國文","國文":"國文","國語文":"國文","英":"英文","英文":"英文","英語文":"英文","數a":"數A","數ａ":"數A","數學a":"數A","數A":"數A","數學A":"數A","數b":"數B","數ｂ":"數B","數學b":"數B","數B":"數B","數學B":"數B","社":"社會","社會":"社會","社會科":"社會","自":"自然","自然":"自然","自然科":"自然","數甲":"數甲","數學甲":"數甲","數乙":"數乙","數學乙":"數乙","物":"物理","物理":"物理","化":"化學","化學":"化學","生":"生物","生物":"生物","歷":"歷史","歷史":"歷史","地":"地理","地理":"地理","公":"公民","公民":"公民","公民與社會":"公民"};
let allRows=[],filteredRows=[],sortState={column:"分數差",ascending:false};
const $=id=>document.getElementById(id);
document.addEventListener("DOMContentLoaded",()=>{$("fileInput").addEventListener("change",loadExcel);$("analyzeBtn").addEventListener("click",applyFilters);$("resetBtn").addEventListener("click",resetFilters);$("clearScoresBtn").addEventListener("click",clearScores);$("exportBtn").addEventListener("click",exportExcel);document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t)));document.querySelectorAll("#resultTable th[data-sort]").forEach(h=>h.addEventListener("click",()=>sortResult(h.dataset.sort)));});
async function loadExcel(e){const file=e.target.files[0];if(!file)return;if(typeof XLSX==="undefined"){setStatus("SheetJS 載入失敗，請確認網路連線。","error");return}setStatus("正在讀取 Excel，請稍候……","");try{const wb=XLSX.read(await file.arrayBuffer(),{type:"array",raw:true}),groups=new Set(),schools=new Set(),found=[];allRows=[];YEARS.forEach(year=>{const sheetName=findSheet(wb.SheetNames,year);if(!sheetName)return;found.push(sheetName);XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{defval:"",raw:true}).forEach(r=>{const school=clean(first(r,["校名","學校名稱","學校"])),dept=clean(first(r,["系組名","系組名稱","科系名稱","科系"]));if(!school||!dept)return;const group=clean(first(r,["學群分類","學群","分類"]))||"未分類";allRows.push({"年度":year,"系組代碼":normalizeCode(first(r,["系組代碼","科系代碼","代碼"])),"校名":school,"系組名":dept,"學群分類":group,"採計及加權":clean(first(r,["採計及加權","採計科目及加權","採計科目","加權"])),"錄取人數":parseNum(first(r,["錄取人數","核定名額","招生名額","名額"])),"最低錄取分數":parseNum(first(r,["最低錄取分數","最低分","錄取分數"]))});groups.add(group);schools.add(school)})});if(!found.length)throw new Error("找不到 111～114 年志願落點分析工作表。");if(!allRows.length)throw new Error("找不到有效校名與系組資料。");fillSelect($("groupSelect"),[...groups].sort(zhSort));fillSelect($("schoolSelect"),[...schools].sort(zhSort));applyFilters();setStatus(`已載入「${file.name}」，共 ${allRows.length.toLocaleString()} 筆資料。`,"success")}catch(err){console.error(err);allRows=[];filteredRows=[];renderAll();setStatus(`讀取失敗：${err.message}`,"error")}finally{e.target.value=""}}
function findSheet(names,year){const exact=[`${year}志願落點分析`,`${year}落點分析`,`${year}年志願落點分析`,`${year}年度志願落點分析`,year];return exact.find(x=>names.includes(x))||names.find(n=>{const s=n.replace(/\s+/g,"");return s.includes(year)&&(s.includes("落點")||s.includes("志願"))})||null}
function applyFilters(){if(!allRows.length){setStatus("尚未載入 Excel 資料檔。","error");return}const years=[...document.querySelectorAll(".year-cb:checked")].map(x=>x.value);if(!years.length){filteredRows=[];renderAll();setStatus("請至少選擇一個年度。","error");return}const scores=getScores(),group=$("groupSelect").value,school=$("schoolSelect").value,sk=kw($("schoolKw").value),dk=kw($("deptKw").value),subk=kw($("subjKw").value),minS=readNum("minScore"),maxS=readNum("maxScore"),minA=readNum("minAdmissions"),minD=readNum("minDifference"),maxD=readNum("maxDifference");filteredRows=allRows.filter(r=>{if(!years.includes(r["年度"]))return false;if(group!=="全部"&&r["學群分類"]!==group)return false;if(school!=="全部"&&r["校名"]!==school)return false;if(sk&&!kw(r["校名"]).includes(sk))return false;if(dk&&!kw(r["系組名"]).includes(dk))return false;if(subk&&!kw(r["採計及加權"]).includes(subk))return false;const s=r["最低錄取分數"],a=r["錄取人數"];if($("scoreRequired").checked&&s===null)return false;if(minS!==null&&(s===null||s<minS))return false;if(maxS!==null&&(s===null||s>maxS))return false;if(minA!==null&&(a===null||a<minA))return false;return true}).map(r=>calcRow(r,scores)).filter(r=>{if($("completeRequired").checked&&r["我的加權分數"]===null)return false;if($("passedOnly").checked&&r["落點判斷"]!=="達標")return false;if(minD!==null&&(r["分數差"]===null||r["分數差"]<minD))return false;if(maxD!==null&&(r["分數差"]===null||r["分數差"]>maxD))return false;return true});sortRows();renderAll();const complete=filteredRows.filter(r=>r["我的加權分數"]!==null).length,passed=filteredRows.filter(r=>r["落點判斷"]==="達標").length;setStatus(`全部 ${allRows.length.toLocaleString()} 筆；符合 ${filteredRows.length.toLocaleString()} 筆；可完整計算 ${complete.toLocaleString()} 筆；達標 ${passed.toLocaleString()} 筆。`,"success")}
function calcRow(row,scores){const c=calcWeighted(row["採計及加權"],scores);let diff=null,status=c.status;if(c.score!==null&&row["最低錄取分數"]!==null){diff=round(c.score-row["最低錄取分數"]);status=diff>=0?"達標":"未達標"}else if(c.score!==null)status="無最低錄取分數";return {...row,"我的加權分數":c.score,"分數差":diff,"落點判斷":status}}
function calcWeighted(text,scores){const rules=parseRules(text);if(!rules.length)return{score:null,status:"無法解析採計規則"};let total=0,missing=[];rules.forEach(r=>{const s=scores[r.subject];if(s===null){if(!missing.includes(r.subject))missing.push(r.subject)}else total+=s*r.weight});if(missing.length)return{score:null,status:`缺少：${missing.join("、")}`};return{score:round(total),status:"計算完成"}}
function parseRules(text){if(!text||!String(text).trim())return[];text=String(text).replace(/\r?\n/g,"、").replace(/[，,；;]/g,"、").replace(/[＋+]/g,"、").replace(/[×ＸxX＊]/g,"*").replace(/[：:]/g,"").replace(/\s+/g,"");const p="(國語文|國文|國|英語文|英文|英|數學A|數A|數學Ａ|數Ａ|數學B|數B|數學Ｂ|數Ｂ|數學甲|數甲|數學乙|數乙|社會科|社會|社|自然科|自然|自|物理|物|化學|化|生物|生|歷史|歷|地理|地|公民與社會|公民|公)",re=new RegExp(`${p}(?:[*]?([0-9０-９]+(?:[\\.．][0-9０-９]+)?))?`,"gi"),out=[];let m;while((m=re.exec(text))!==null){const subject=normSubject(m[1]);if(!subject)continue;const weight=m[2]?parseFlexible(m[2]):1;if(weight===null||weight<=0)continue;const ex=out.find(x=>x.subject===subject);if(ex)ex.weight=weight;else out.push({subject,weight})}return out}
function normSubject(s){const c=String(s).trim().replace(/\s+/g,"");return ALIASES[c]||ALIASES[c.toLowerCase()]||null}function getScores(){const o={};Object.entries(SUBJECT_INPUTS).forEach(([s,id])=>o[s]=readNum(id));return o}
function renderAll(){renderResults();renderSummaries()}function renderResults(){const tb=document.querySelector("#resultTable tbody");tb.innerHTML="";if(!filteredRows.length){tb.innerHTML=`<tr><td colspan="${RESULT_COLUMNS.length}" style="text-align:center;padding:25px">目前沒有符合條件的資料。</td></tr>`;return}const f=document.createDocumentFragment();filteredRows.forEach(r=>{const tr=document.createElement("tr");RESULT_COLUMNS.forEach(c=>{const td=document.createElement("td"),v=r[c];if(isNumCol(c))td.classList.add("num");if(c==="分數差"&&typeof v==="number")td.classList.add(v>=0?"positive":"negative");if(c==="落點判斷")td.classList.add(v==="達標"?"pass":v==="未達標"?"fail":"missing");td.textContent=format(c,v);tr.appendChild(td)});f.appendChild(tr)});tb.appendChild(f)}
function renderSummaries(){renderSummary("groupTable",makeSummary("學群分類"));renderSummary("schoolTable",makeSummary("校名"));renderSummary("yearTable",makeSummary("年度"))}function makeSummary(col){const map=new Map();filteredRows.forEach(r=>{const k=r[col]||"未分類";if(!map.has(k))map.set(k,[]);map.get(k).push(r)});const out=[];map.forEach((rows,k)=>{const admitted=rows.map(r=>r["最低錄取分數"]).filter(isFiniteNum),personal=rows.map(r=>r["我的加權分數"]).filter(isFiniteNum),diffs=rows.map(r=>r["分數差"]).filter(isFiniteNum),pass=rows.filter(r=>r["落點判斷"]==="達標").length,fail=rows.filter(r=>r["落點判斷"]==="未達標").length;out.push({"分類":k,"校系筆數":rows.length,"達標筆數":pass,"未達標筆數":fail,"無法計算筆數":rows.length-pass-fail,"錄取人數合計":rows.reduce((s,r)=>s+(isFiniteNum(r["錄取人數"])?r["錄取人數"]:0),0),"平均最低錄取分數":avg(admitted),"最低錄取分數最低值":min(admitted),"最低錄取分數最高值":max(admitted),"平均個人加權分數":avg(personal),"平均分數差":avg(diffs)})});return out.sort((a,b)=>col==="年度"?String(b["分類"]).localeCompare(String(a["分類"])):(b["校系筆數"]-a["校系筆數"]))}function renderSummary(id,rows){const t=$(id),th=t.querySelector("thead"),tb=t.querySelector("tbody");th.innerHTML="";tb.innerHTML="";const hr=document.createElement("tr");SUMMARY_COLUMNS.forEach(c=>{const x=document.createElement("th");x.textContent=c;hr.appendChild(x)});th.appendChild(hr);if(!rows.length){tb.innerHTML=`<tr><td colspan="${SUMMARY_COLUMNS.length}" style="text-align:center;padding:25px">目前沒有可統計的資料。</td></tr>`;return}rows.forEach(r=>{const tr=document.createElement("tr");SUMMARY_COLUMNS.forEach(c=>{const td=document.createElement("td");if(isNumCol(c))td.classList.add("num");td.textContent=format(c,r[c]);tr.appendChild(td)});tb.appendChild(tr)})}
function sortResult(col){if(sortState.column===col)sortState.ascending=!sortState.ascending;else{sortState.column=col;sortState.ascending=!["年度","錄取人數","最低錄取分數","我的加權分數","分數差"].includes(col)}sortRows();renderResults()}function sortRows(){const c=sortState.column,d=sortState.ascending?1:-1;filteredRows.sort((a,b)=>{const x=a[c],y=b[c],xe=x===null||x===undefined||x==="",ye=y===null||y===undefined||y==="";if(xe&&ye)return 0;if(xe)return 1;if(ye)return-1;if(typeof x==="number"&&typeof y==="number")return(x-y)*d;return String(x).localeCompare(String(y),"zh-Hant")*d})}
function exportExcel(){if(!filteredRows.length){alert("目前沒有可匯出的資料。");return}const wb=XLSX.utils.book_new();appendSheet(wb,filteredRows.map(r=>Object.fromEntries(RESULT_COLUMNS.map(c=>[c,r[c]??""]))),"篩選結果");appendSheet(wb,Object.entries(getScores()).map(([k,v])=>({"科目":k,"個人成績":v??""})),"個人成績");appendSheet(wb,makeSummary("學群分類"),"依學群統計");appendSheet(wb,makeSummary("校名"),"依學校統計");appendSheet(wb,makeSummary("年度"),"依年度統計");XLSX.writeFile(wb,`大學科系落點分析_${stamp()}.xlsx`)}function appendSheet(wb,rows,name){const safe=rows.length?rows:[{"資料":"無資料"}],ws=XLSX.utils.json_to_sheet(safe);ws["!cols"]=Object.keys(safe[0]).map(c=>({wch:Math.min(Math.max(c.length+2,...safe.slice(0,1000).map(r=>String(r[c]??"").length+2)),45)}));XLSX.utils.book_append_sheet(wb,ws,name)}
function resetFilters(){document.querySelectorAll(".year-cb").forEach(x=>x.checked=true);$("groupSelect").value="全部";$("schoolSelect").value="全部";["schoolKw","deptKw","subjKw","minScore","maxScore","minAdmissions","minDifference","maxDifference"].forEach(id=>$(id).value="");["scoreRequired","completeRequired","passedOnly"].forEach(id=>$(id).checked=false);sortState={column:"分數差",ascending:false};if(allRows.length)applyFilters()}function clearScores(){Object.values(SUBJECT_INPUTS).forEach(id=>$(id).value="");if(allRows.length)applyFilters()}function switchTab(tab){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab-content").forEach(x=>x.classList.remove("active"));tab.classList.add("active");$(tab.dataset.target).classList.add("active")}
function first(r,keys){for(const k of keys)if(Object.prototype.hasOwnProperty.call(r,k)&&r[k]!==null&&r[k]!==undefined&&String(r[k]).trim()!=="")return r[k];return""}function clean(v){return v===null||v===undefined?"":String(v).trim()}function normalizeCode(v){if(v===null||v===undefined||String(v).trim()==="")return"";const s=String(v).trim();return/^\d+(?:\.0+)?$/.test(s)?String(Math.trunc(Number(s))).padStart(4,"0"):s}function fullWidth(s){const m={"０":"0","１":"1","２":"2","３":"3","４":"4","５":"5","６":"6","７":"7","８":"8","９":"9","．":".","－":"-","＋":"+"};return String(s).replace(/[０-９．－＋]/g,c=>m[c]||c)}function parseFlexible(v){if(v===null||v===undefined||String(v).trim()==="")return null;const n=Number(fullWidth(String(v).trim()).replace(/，/g,".").replace(/,/g,".").replace(/\s+/g,""));return Number.isFinite(n)?n:null}function parseNum(v){if(v===null||v===undefined||String(v).trim()==="")return null;return parseFlexible(String(v).replace(/,/g,"").replace(/，/g,"").replace(/[人分]/g,""))}function readNum(id){return parseFlexible($(id).value)}function kw(v){return String(v??"").trim().toLowerCase().replace(/\s+/g,"")}function fillSelect(sel,vals){sel.innerHTML='<option value="全部">全部</option>';vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o)})}function setStatus(msg,type){$("status").className="status"+(type?" "+type:"");$("status").textContent=msg}function round(n){return Math.round((n+Number.EPSILON)*100)/100}function isFiniteNum(v){return typeof v==="number"&&Number.isFinite(v)}function avg(a){return a.length?round(a.reduce((s,v)=>s+v,0)/a.length):null}function min(a){return a.length?Math.min(...a):null}function max(a){return a.length?Math.max(...a):null}function zhSort(a,b){return String(a).localeCompare(String(b),"zh-Hant")}function isNumCol(c){return["錄取人數","最低錄取分數","我的加權分數","分數差","校系筆數","達標筆數","未達標筆數","無法計算筆數","錄取人數合計","平均最低錄取分數","最低錄取分數最低值","最低錄取分數最高值","平均個人加權分數","平均分數差"].includes(c)}function format(c,v){if(v===null||v===undefined||v==="")return"";if(["最低錄取分數","我的加權分數","分數差","平均最低錄取分數","最低錄取分數最低值","最低錄取分數最高值","平均個人加權分數","平均分數差"].includes(c)&&typeof v==="number")return v.toFixed(2);if(isNumCol(c)&&typeof v==="number")return v.toLocaleString();return String(v)}function stamp(){const d=new Date(),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
